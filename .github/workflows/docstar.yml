
name: Sync Docs to DocStar
on:
  push:
    branches:
      - main
    paths:
      - '*.md'
      - '**/*.md'
      - docstar.json
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send changed files to DocStar
        env:
          DOCSTAR_API_KEY: ${{ secrets.DOCSTAR_API_KEY }}
          DOCSTAR_COLLECTION_ID: qgXH2tplpHzw
        run: >
          set -e


          echo "Preparing changed files with content..."


          if [ -z "${{ github.event.before }}" ] || \
             [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "First commit — marking all docs as Added"
            CHANGED=$(git ls-files | grep '\.md$' | awk '{print "A\t"$0}')
          else
            CHANGED=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -E '^[A-Z]\s+.*\.md$' || true)
          fi


          echo "Changed files:"

          echo "$CHANGED"


          if [ -z "$CHANGED" ]; then
            echo "No docs changes detected."
            exit 0
          fi


          echo "[]" > /tmp/files.json


          while IFS=$'\t' read -r STATUS FILE; do
            [ -z "$FILE" ] && continue

            if [ "$STATUS" = "D" ]; then
              jq -n \
                --arg path "$FILE" \
                --arg status "$STATUS" \
                '{
                  path: $path,
                  status: $status,
                  content: null
                }' > /tmp/file_obj.json
            else
              jq -Rs \
                --arg path "$FILE" \
                --arg status "$STATUS" \
                '{
                  path: $path,
                  status: $status,
                  content: .
                }' < "$FILE" > /tmp/file_obj.json
            fi

            jq -s '.[0] + [.[1]]' /tmp/files.json /tmp/file_obj.json > /tmp/files_new.json
            mv /tmp/files_new.json /tmp/files.json

          done <<< "$CHANGED"


          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg collection "$DOCSTAR_COLLECTION_ID" \
            --slurpfile files /tmp/files.json \
            '{
              repository: $repo,
              branch: $branch,
              commit: $commit,
              collectionId: $collection,
              publish: true,
              overwrite: true,
              replace: true,
              files: $files[0]
            }' > /tmp/payload.json


          echo "Final Payload created at /tmp/payload.json"


          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST https://api.docstar.io/import/github?debugLogs=true \
            -H "Authorization: Bearer $DOCSTAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json)

          echo "$RESPONSE"


          echo "DocStar sync completed."
